image:
  repository: harbor.int.chorus-tre.ch/backend-master/backend
  imagePullPolicy: Always

serviceMonitor:
  enabled: true
  basicAuth:
    enabled: true
    secretName: "chorus-int-backend-metrics"

config:
  clients:
    oci:
      host: "harbor.int.chorus-tre.ch"
      username: "robot$chorus-int"
      password: "" # set in secret
    kubernetes:
      default_registry: "harbor.int.chorus-tre.ch"
      # xpra-server image version to inject into the workbench CR
      server_version: "6.3.6-r0-3"
      # app-init image version to inject into the workbench CR
      init_container_version: "0.0.2-7"
  daemon:
    jwt:
      secret: "" # set in secret
    private_key: "" # set in secret
    salt: feast-salutary3-online-slogan-chafe-july-rickety-desktop-from
    http:
      headers:
        access_control_allow_origins:
          - "https://int.chorus-tre.ch"
          - "https://backend.int.chorus-tre.ch"
          - "http://localhost:3000"
        cookie_domain: ".int.chorus-tre.ch"
    expose_error_stack_trace: true
    metrics:
      authentication:
        enabled: true
        password: "" # set in secret
  services:
    authentication_service:
      modes:
        internal:
          main_source: false
          public_registration_enabled: false
        keycloak:
          enabled: true
          main_source: true
          openid:
            chorus_backend_host: "https://backend.int.chorus-tre.ch"
            chorus_frontend_redirect_url: "https://int.chorus-tre.ch/oauthredirect"
            authorize_url: "https://auth.int.chorus-tre.ch/realms/chorus/protocol/openid-connect/auth"
            token_url: "https://auth.int.chorus-tre.ch/realms/chorus/protocol/openid-connect/token"
            user_info_url: "https://auth.int.chorus-tre.ch/realms/chorus/protocol/openid-connect/userinfo"
            logout_url: "https://auth.int.chorus-tre.ch/realms/chorus/protocol/openid-connect/logout?client_id=chorus&post_logout_redirect_uri=https://int.chorus-tre.ch"
            client_secret: "" # set in secret
        keycloakdev:
          type: openid
          enabled: true
          button_text: "Login with Keycloak - dev mode"
          order: 3
          openid:
            id: keycloakdev
            chorus_backend_host: "https://backend.int.chorus-tre.ch"
            enable_frontend_redirect: true
            chorus_frontend_redirect_url: "http://localhost:3000/oauthredirect"
            authorize_url: "https://auth.int.chorus-tre.ch/realms/chorus/protocol/openid-connect/auth"
            token_url: "https://auth.int.chorus-tre.ch/realms/chorus/protocol/openid-connect/token"
            user_info_url: "https://auth.int.chorus-tre.ch/realms/chorus/protocol/openid-connect/userinfo"
            logout_url: "https://auth.int.chorus-tre.ch/realms/chorus/protocol/openid-connect/logout?client_id=chorus&post_logout_redirect_uri=http://localhost:3000"
            user_name_claim: "preferred_username"
            client_id: chorus
            client_secret: ""  # set in secret
            scopes:
              - openid
              - profile
              - email
              - roles
    workbench_service:
      backend_in_k8s: true
      workbench_idle_timeout: 504h #21d
    workspace_file_service:
      stores:
        archive:
          workspace_prefix: "workspaces/%s/data" # where %s will be replaced by the namespace name (workspace+id)
    approval_request_service:
      staging_file_store_name: archive
    openid_connect_provider:
      enabled: true
      issuer_url: "https://backend.int.chorus-tre.ch/openid-connect"
      frontend_interactions_url: "https://backend.int.chorus-tre.ch/auth-ui"
      jwks: "" # set in secret
      clients:
        gitlab:
          client_name: "Gitlab int Chorus OIDC Client"
          client_secret: "" # set in secret
          redirect_uris:
            - "https://gitlab.int.chorus-tre.ch/users/auth/openid_connect/callback"
          grant_types:
            - authorization_code
            - refresh_token
          response_types:
            - code
          scope: "openid profile email roles"
          token_endpoint_auth_method: "client_secret_post"
          only_pre_logged_for_client: false
    steward:
      user:
        password: "" # set in secret
  storage:
    datastores:
      audit:
        host: chorus-int-audit-db-postgresql
        username: backend-audit
        password: "" # set in secret
      chorus:
        host: chorus-int-backend-db-postgresql
        username: backend
        password: "" # set in secret
    migrations:
      audit:
        username: backend-audit # TODO: remove once a migrator role is created for this db
        password: "" # set in migrator secret
      chorus:
        username: backend # TODO: remove once a migrator role is created for this db
        password: "" # set in migrator secret
    file_stores:
      archive:
        minio_config:
          endpoint: juicefs-s3-gateway.kube-system.svc.cluster.local:9000
          access_key_id: "" # set in secret
          secret_access_key: "" # set in secret
      disk:
        disk_config:
          enabled: false
