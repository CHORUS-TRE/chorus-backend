# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

fullnameOverride: ""
nameOverride: ""

image:
  repository: harbor.build.chorus-tre.ch/backend-acceptance/backend
  tag: ""
  imagePullPolicy: IfNotPresent

replicaCount: 1

imagePullSecrets:
- name: regcred

# Custom environment variables to be set in the backend container
# env:
#   - name: ENV_VAR_NAME
#     value: "value"
# envFrom:
#   - secretRef:
#       name: my-secret

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  createSecret: false

priorityClassName: ""
podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 5000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /api/rest/v1/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/rest/v1/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

serviceMonitor:
  enabled: false
  basicAuth:
    enabled: false
    secretName: ""
    usernameKey: "username"
    passwordKey: "password"
  labels:
    app.kubernetes.io/component: metrics

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

clusterRole:
  create: false

config:
  clients:
    oci:
      enabled: false
    harbor:
      enabled: false
    kubernetes:
      enabled: false
  daemon:
    jwt:
      secret: NxioXzY4v4IEGdWmIrTG9Ng7Cgo5j3yO
    private_key: |
      -----BEGIN EC PRIVATE KEY-----
      MHcCAQEEII8kGzWHAJfOs9i/4Itm6XmR/CIb6ePuqx+2waa/U0EuoAoGCCqGSM49
      AwEHoUQDQgAEg3/teKmW70zuiWjYTOynPqPHLOM7XExQUeOD6WSGdlJph3jZzuXh
      f3hlc8rjTTQFa/xIsE+FYdpzVv5TB5qJVw==
      -----END EC PRIVATE KEY-----
    salt: SNN6lK7wfEHVvN7mAaTI4nH375yQZzV8
    metrics:
      enabled: false
  services:
    authentication_service:
      enabled: true
      modes:
        internal:
          public_registration_enabled: false
        keycloak:
          enabled: false
    audit_service:
      enabled: false
    workbench_service:
      backend_in_k8s: true
    approval_request_service:
      staging_file_store_name: disk
    steward:
      user:
        password: password
  # TODO: refactor storage with the postgresql chart values below
  #       to avoid duplication
  storage:
    datastores:
      audit:
        # the audit service is disabled
        # but we still need to provide a dummy password
        password: password
      chorus:
        host: "" # set dynamically in argo-workflows
        password: password
    file_stores:
      archive:
        minio_config:
          enabled: false
      disk:
        disk_config:
          base_path: /var/lib/chorus/disk/.diskfilestore

postgresql:
  enabled: true
  chorusNetworkPolicy:
    enabled: false
  postgresql:
    global:
      # Using a storage class
      # with reclaim policy 'Delete'
      # for CI
      defaultStorageClass: "ceph-corbo-rbd-hdd"
      postgresql:
        auth:
          postgresPassword: password
          username: admin
          password: password
          database: chorus
          existingSecret: ""
          secretKeys:
            adminPasswordKey: postgres-password
            userPasswordKey: password
            replicationPasswordKey: ""
        service:
          port: 5432

    tls:
      enabled: true
      certificatesSecret: backend-db-tls-secret

    metrics:
      enabled: false
      serviceMonitor:
        enabled: false

    primary:
      persistence:
        size: 8Gi
      resourcesPreset: small
      pdb:
        create: false
      networkPolicy:
        enabled: false

    image:
      # https://hub.docker.com/r/bitnamilegacy/postgresql
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: 16.4.0

  certificate:
    enabled: true
    secretName: backend-db-tls-secret
    issuerRef:
      name: private-ca-cluster-issuer
      kind: ClusterIssuer
